<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Typefaces. Plus Jakarta Sans for headings, Inter for body and UI, and
      Source Serif 4 — italic only — as the accent face inside headlines.
      Only the weights actually used by the type scale in theme.css are
      requested — every extra weight is a download nobody sees.
      `display=swap` renders text in the fallback immediately rather than
      leaving the page blank while the fonts arrive.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,600&display=swap"
      rel="stylesheet"
    />

    <title>FORESE</title>
    <meta name="description" content="The official website of the FORESE Club." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="FORESE" />
    <meta property="og:description" content="The official website of the FORESE Club." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
